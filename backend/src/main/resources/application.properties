spring.application.name=account

# Errors as RFC 9457 problem details, so the UI can show their "detail".
spring.mvc.problemdetails.enabled=true

# Profile pictures: the browser crops them first, so real uploads are far smaller.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Profile pictures. Prod: a Docker volume, see compose.yml.
account.storage-dir=./data/avatars
